#
# Erstellt eine Control Plane Node und zwei Worker Nodes
#

vm:
  count: 3
  ports:
    - 16443
  
  # Worker Nodes
  cpu: 2
  memory: 4Gi
  storage: 32Gi
  userdata: https://raw.githubusercontent.com/mc-b/k8sd2o/refs/heads/v2/cloud-init-worker.yaml

# Control Plane
vm-0:
  cpu: 4
  memory: 16Gi
  storage: 64Gi  
  userdata: https://raw.githubusercontent.com/mc-b/k8sd2o/refs/heads/v2/cloud-init-control.yaml
  ports:
    - 16443
    - 18888
    - 30443
      